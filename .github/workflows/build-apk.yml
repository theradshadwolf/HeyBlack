name: Build HeyBlack APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/GlassesSDKSample/gradlew

      - name: Build Release APK
        working-directory: android/GlassesSDKSample
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/heyblack-release.keystore

          UNSIGNED_APK=$(find android/GlassesSDKSample/app/build/outputs/apk/release -name "*.apk" | head -1)
          ALIGNED_APK="/tmp/heyblack-aligned.apk"
          SIGNED_APK="/tmp/heyblack-release-signed.apk"

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/zipalign \
            -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks /tmp/heyblack-release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV

      - name: Set unsigned APK path (no secrets)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          UNSIGNED_APK=$(find android/GlassesSDKSample/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "SIGNED_APK=$UNSIGNED_APK" >> $GITHUB_ENV

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyBlack-release-apk
          path: ${{ env.SIGNED_APK }}
          retention-days: 30
