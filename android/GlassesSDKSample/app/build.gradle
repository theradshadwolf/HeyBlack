plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sdk.glassessdksample'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sdk.glassessdksample'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv('KEYSTORE_PATH')
            def keystorePass = System.getenv('KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('KEY_ALIAS')
            def keyPass = System.getenv('KEY_PASSWORD')
            if (keystoreFile && keystorePass && keyAlias && keyPass) {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias keyAlias
                keyPassword keyPass
            } else {
                storeFile debug.storeFile
                storePassword debug.storePassword
                keyAlias debug.keyAlias
                keyPassword debug.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation files('libs/glasses_sdk_20250723_v01.aar')
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.getActivity:XXPermissions:20.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.github.ForgetAll:LoadingDialog:v1.1.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}
